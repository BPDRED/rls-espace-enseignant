<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Espace enseignant RLS</title><link rel="stylesheet" href="./style.css"></head><body>
<section class="auth" id="auth"><h1>Espace enseignant</h1><p>Vos documents et votre suivi de classe, accessibles après connexion.</p><form id="loginForm"><label for="email">Adresse email personnelle</label><input id="email" type="email" autocomplete="email" required><button type="submit" id="loginButton">Recevoir un lien de connexion</button></form><p id="loginStatus" role="status" aria-live="polite"></p></section>
<div class="app-shell" id="shell" hidden><header class="app-header"><button class="back" id="back" aria-label="Retour"></button><h1 class="hd-title" id="date"></h1><div class="time" id="time"></div></header><nav id="mainNav" aria-label="Navigation"><div class="tab-list" id="tabList"></div><span class="ink" id="ink"></span></nav><div class="session-bar"><span id="saveStatus" role="status" aria-live="polite">Connexion…</span><button id="refresh" aria-label="Actualiser depuis le serveur">Actualiser</button><button id="logout">Déconnexion</button></div><main id="view"></main></div>
<div id="viewer"><iframe id="vFrame" title="Document"></iframe><div class="viewer-tools"><a id="download" download>Télécharger</a></div><div class="v-hot" id="vHot"></div><button class="v-back" data-vclose id="vBack" aria-label="Retour"></button></div><dialog id="dlg"></dialog><script type="module" src="./app.js"></script></body></html>
