<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Lecture du document</title><link rel="stylesheet" href="./document-reader.css"></head>
<body><header id="readerToolbar" aria-label="Lecture du PDF" hidden><button id="previous" aria-label="Page précédente">←</button><label>Page <input id="pageNumber" type="number" min="1" value="1" aria-label="Numéro de page"></label><span id="pageCount"></span><button id="next" aria-label="Page suivante">→</button><span class="spacer"></span><button id="zoomOut" aria-label="Réduire">−</button><output id="zoomValue"></output><button id="zoomIn" aria-label="Agrandir">+</button><button id="fit">Ajuster</button></header><p id="readerStatus" role="status" aria-live="polite">Chargement du document…</p><main id="readerContent" tabindex="0" aria-label="Contenu du document"></main><script type="module" src="./document-reader.js"></script></body></html>
